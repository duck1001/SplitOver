name: Build SplitOver

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq make git clang lld llvm dpkg-dev fakeroot zip unzip xz-utils libplist-dev libssl-dev curl
          sudo curl -fL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          ldid -v || true

      - name: Install Theos (roothide) + SDK
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks "$HOME/sdks-tmp"
          mkdir -p "$THEOS/sdks"
          cp -R "$HOME/sdks-tmp/iPhoneOS16.5.sdk" "$THEOS/sdks/"

          # roothide/theos 只带 macOS 工具链，Linux 上把系统 LLVM 软链过去
          BIN="$THEOS/toolchain/linux/iphone/bin"
          mkdir -p "$BIN"
          for tool in clang clang++ llvm-ar llvm-nm llvm-strip llvm-objcopy llvm-objdump; do
            ln -sf "$(command -v $tool)" "$BIN/$tool"
          done
          ln -sf "$(command -v ld64.lld || command -v ld.lld)" "$BIN/ld"
          ln -sf "$(command -v ld64.lld || command -v ld.lld)" "$BIN/ld64.lld"

          # Theos 的 Linux 目标默认 -fuse-ld=llvm，clang 会退回 GNU ld 报 llvm 模拟模式错误
          grep -rl "fuse-ld=llvm" "$THEOS/makefiles" 2>/dev/null | xargs -r sed -i 's/fuse-ld=llvm/fuse-ld=lld/g' || true
          sed -i 's#-fuse-ld=$(SDKBINPATH)/$(_THEOS_TARGET_SDK_BIN_PREFIX)ld#-fuse-ld=/usr/bin/ld64.lld#' "$THEOS/makefiles/targets/_common/darwin_tail.mk"
          grep -rn "fuse-ld" "$THEOS/makefiles" | head
          ls -l /usr/bin/ld64.lld
          ln -sf /usr/local/bin/ldid "$BIN/ldid"
          ls -l "$BIN"

      - name: Build roothide package
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide \
            ARCHS="arm64e" \
            TARGET=iphone:clang:16.5:15.0 \
            DEBUG=0

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SplitOver-roothide-deb
          path: packages/*.deb
          if-no-files-found: error
