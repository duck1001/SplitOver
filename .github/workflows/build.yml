name: Build SplitOver

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make git clang lld dpkg-dev fakeroot zip unzip xz-utils libplist-dev libssl-dev libtinfo6 curl
          sudo curl -fL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          ldid -v || true

      - name: Install Theos + SDK
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks "$HOME/sdks-tmp"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$HOME/sdks-tmp/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"
          ls "$HOME/theos/sdks"

      - name: Build roothide package
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide \
            ARCHS="arm64e" \
            TARGET=iphone:clang:16.5:15.0 \
            DEBUG=0

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SplitOver-roothide-deb
          path: packages/*.deb
          if-no-files-found: error
