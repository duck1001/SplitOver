name: Build SplitOver

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: |
          set -e
          brew install ldid
          command -v ldid

      - name: Install Theos + SDK
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks "$HOME/sdks-tmp"
          mkdir -p "$THEOS/sdks"
          cp -R "$HOME/sdks-tmp/iPhoneOS16.5.sdk" "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Build roothide package
        run: |
          set -e
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide \
            ARCHS="arm64e" \
            TARGET=iphone:clang:16.5:15.0 \
            DEBUG=0

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SplitOver-roothide-deb
          path: packages/*.deb
          if-no-files-found: error
